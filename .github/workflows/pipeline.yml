name: Score pending uploads

# Every 5 minutes: check new videos (Python), then score the validated ones (Java service).
# Needs these repository secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, SCORING_URL, ADMIN_TOKEN.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SCORING_URL: ${{ secrets.SCORING_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in SUPABASE_URL SUPABASE_SERVICE_KEY SCORING_URL ADMIN_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video-checker/requirements.txt

      - name: System libraries for MediaPipe
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2

      - name: Install checker
        run: |
          pip install -r video-checker/requirements.txt
          # pose cross-check is optional: if this install fails the pipeline still works without it
          pip install -r video-checker/requirements-pose.txt || echo "::warning::MediaPipe not installed, pose check skipped"

      - name: Check new videos
        working-directory: video-checker
        run: python -m app.worker --once

      - name: Score validated submissions
        run: |
          # The free Java host sleeps when idle, so the first call can take about a minute.
          curl --silent --show-error --fail-with-body --retry 4 --retry-delay 20 --retry-all-errors \
            --max-time 120 -X POST \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            "${SCORING_URL%/}/api/jobs/score-pending"

      - name: Free storage if it is 70% full
        # Compresses, then deletes, videos that scored below 70. Never blocks the pipeline.
        continue-on-error: true
        working-directory: video-checker
        run: python -m app.retention

      - name: Email notifications
        # Optional: only runs when the SMTP_* secrets exist. Never blocks the pipeline.
        continue-on-error: true
        working-directory: video-checker
        run: python -m app.notify
