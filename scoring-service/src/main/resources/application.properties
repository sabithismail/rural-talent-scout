server.port=${PORT:8080}
spring.application.name=scoring-service

# Browser origins allowed to call the API (comma separated). Set CORS_ORIGINS to your deployed website URL.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Never show stack traces or internal messages in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Only needed for POST /api/jobs/score-pending (writes scores back to Supabase)
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.admin-token=${ADMIN_TOKEN:}
